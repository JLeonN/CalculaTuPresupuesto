name: Desplegar SPA en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar SPA
        env:
          QCLI_FIREBASE_API_KEY: ${{ vars.QCLI_FIREBASE_API_KEY }}
          QCLI_FIREBASE_AUTH_DOMAIN: ${{ vars.QCLI_FIREBASE_AUTH_DOMAIN }}
          QCLI_FIREBASE_PROJECT_ID: ${{ vars.QCLI_FIREBASE_PROJECT_ID }}
          QCLI_FIREBASE_APP_ID: ${{ vars.QCLI_FIREBASE_APP_ID }}
          QCLI_FIREBASE_STORAGE_BUCKET: ${{ vars.QCLI_FIREBASE_STORAGE_BUCKET }}
          QCLI_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.QCLI_FIREBASE_MESSAGING_SENDER_ID }}
        shell: bash
        run: |
          for variable in QCLI_FIREBASE_API_KEY QCLI_FIREBASE_AUTH_DOMAIN QCLI_FIREBASE_PROJECT_ID QCLI_FIREBASE_APP_ID QCLI_FIREBASE_STORAGE_BUCKET QCLI_FIREBASE_MESSAGING_SENDER_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "Falta configurar la variable $variable en GitHub Actions."
              exit 1
            fi
          done
          if [[ "$QCLI_FIREBASE_PROJECT_ID" != "calculatupresupuesto-prod" ]]; then
            echo "La configuración de Firebase no corresponde a producción."
            exit 1
          fi
          npm run build

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/spa

  desplegar:
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: construir
    steps:
      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
